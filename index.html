<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(ellipse at 50% 30%,#4a0f33 0%,#2a0722 45%,#10020d 100%);
    font-family:'Dancing Script','Great Vibes',cursive;color:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px}
  .frame{
    position:relative;width:min(56vw,300px);aspect-ratio:3/4;border-radius:50% 50% 46% 46% / 40% 40% 60% 60%;
    padding:6px;background:conic-gradient(from 0deg,#ff9ec4,#ffd6e8,#ff5f9e,#ffe3b3,#ff9ec4);
    animation:spin 8s linear infinite, pop 1.8s cubic-bezier(.2,1.4,.4,1) both;
    box-shadow:0 0 40px 8px rgba(255,105,160,.55),0 0 120px 30px rgba(255,60,130,.3);
  }
  .frame .inner{position:absolute;inset:6px;border-radius:inherit;overflow:hidden;animation:unspin 8s linear infinite;background:#000}
  @property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
  @keyframes spin{to{filter:hue-rotate(25deg)}}
  @keyframes unspin{to{}}
  @keyframes pop{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  .frame img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block;animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.06)}}
  .frame::after{content:"";position:absolute;inset:-14px;border-radius:inherit;border:2px solid rgba(255,182,213,.5);animation:ring 2.4s ease-out infinite}
  @keyframes ring{from{transform:scale(.96);opacity:1}to{transform:scale(1.18);opacity:0}}
  .love{margin-top:22px;font-family:'Great Vibes','Dancing Script',cursive;font-size:clamp(54px,14vw,110px);line-height:1.15;
    color:#ffd6e8;text-shadow:0 0 12px rgba(255,80,140,.9),0 0 30px rgba(255,60,130,.6);animation:glow 2.5s ease-in-out infinite}
  @keyframes glow{50%{text-shadow:0 0 20px rgba(255,120,170,1),0 0 50px rgba(255,60,130,.9);color:#fff}}
  .love span{display:inline-block;opacity:0;transform:translateY(30px) scale(.5);animation:letter .8s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes letter{to{opacity:1;transform:none}}
  @keyframes shine{to{background-position:-300% 0}}
  .sub{margin-top:8px;font-size:clamp(20px,4.6vw,30px);color:#ffc8dd;opacity:0;animation:fade 2s 3.4s forwards;animation-play-state:paused;letter-spacing:.5px}
  .sub2{margin-top:6px;font-size:clamp(16px,3.6vw,22px);color:#ffb3d1;opacity:0;animation:fade 2s 5s forwards;animation-play-state:paused}
  @keyframes fade{to{opacity:1}}
  .heart{display:inline-block;color:#ff3d7f;animation:beat 1.1s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(1)}45%{transform:scale(1.25)}}
  .hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:16px;color:#ff9ec4;opacity:.7;z-index:3;font-family:system-ui,sans-serif;font-size:12px}

  #scene{opacity:0;pointer-events:none;transition:opacity 1.2s ease}
  body.open #scene{opacity:1;pointer-events:auto}
  #gate{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity 1s ease .5s,transform 1.2s cubic-bezier(.6,0,.9,.4);-webkit-tap-highlight-color:transparent}
  #gate .big{width:min(72vw,340px);animation:hb 1.2s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(255,50,120,.9)) drop-shadow(0 0 80px rgba(255,50,120,.5))}
  @keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
  #gate .tap{margin-top:34px;font-size:clamp(24px,6vw,34px);color:#ffc8dd;animation:blink 1.8s ease-in-out infinite;text-shadow:0 0 14px rgba(255,80,140,.8)}
  @keyframes blink{50%{opacity:.35}}
  #gate .top{position:absolute;top:9vh;font-size:clamp(24px,6vw,34px);color:#ffd6e8;text-shadow:0 0 14px rgba(255,80,140,.8)}
  body.open #gate{opacity:0;pointer-events:none;transform:scale(9)}
</style>

  <h1 class="love" id="love"></h1>
  <p class="sub">You are my today, my tomorrow, my forever <span class="heart">❤</span></p>
  <p class="sub2">Will you be mine for life? 💍</p>
</div>
</div>
<div class="hint">kahin bhi tap karo ❤</div>
<script>
const text="I Love You";
const h=document.getElementById('love');
[...text].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch===' '?' ':ch;s.style.animationDelay=(1.2+i*.17)+'s';s.style.animationPlayState='paused';h.appendChild(s)});

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();

function heartPath(x,y,s){
  ctx.beginPath();
  ctx.moveTo(x,y+s*.35);
  ctx.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.35);
  ctx.bezierCurveTo(x-s*.5,y+s*.7,x,y+s*.85,x,y+s);
  ctx.bezierCurveTo(x,y+s*.85,x+s*.5,y+s*.7,x+s*.5,y+s*.35);
  ctx.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.35);
  ctx.closePath();
}
const colors=['#ff3d7f','#ff6fa5','#ff9ec4','#ffc2d9','#ff5252','#ffd6e8'];
const hearts=[],petals=[],sparks=[],bursts=[];
function newHeart(initial){
  return{x:Math.random()*W,y:initial?Math.random()*H:H+30,s:10+Math.random()*28,v:.4+Math.random()*1.1,
    sw:Math.random()*Math.PI*2,sa:.4+Math.random()*1.2,c:colors[Math.random()*colors.length|0],a:.25+Math.random()*.6}
}
function newPetal(initial){
  return{x:Math.random()*W,y:initial?Math.random()*H:-20,s:6+Math.random()*9,v:.6+Math.random()*1.2,
    r:Math.random()*6.28,vr:(Math.random()-.5)*.06,sw:Math.random()*6.28,c:Math.random()<.5?'#ff8fb7':'#ffc2d9'}
}
for(let i=0;i<38;i++)hearts.push(newHeart(true));
for(let i=0;i<30;i++)petals.push(newPetal(true));
for(let i=0;i<70;i++)sparks.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,t:Math.random()*6.28,sp:.02+Math.random()*.04});

function burst(x,y){
  for(let i=0;i<26;i++){
    const a=Math.random()*6.28,sp=2+Math.random()*5;
    bursts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,s:8+Math.random()*18,c:colors[Math.random()*colors.length|0],life:1});
  }
}
addEventListener('pointerdown',e=>burst(e.clientX,e.clientY));
document.getElementById('gate').addEventListener('click',()=>{
  if(document.body.classList.contains('open'))return;
  for(let i=0;i<5;i++)setTimeout(()=>burst(W/2+(Math.random()-.5)*160,H/2+(Math.random()-.5)*160),i*120);
  document.body.classList.add('open');
  document.querySelectorAll('#scene .love span,#scene .sub,#scene .sub2').forEach(e=>e.style.animationPlayState='running');
  setTimeout(()=>document.getElementById('gate').remove(),2200);
});
setInterval(()=>burst(Math.random()*W,Math.random()*H*.6),3500);

function frame(){
  ctx.clearRect(0,0,W,H);
  for(const s of sparks){s.t+=s.sp;ctx.globalAlpha=.3+.7*Math.abs(Math.sin(s.t));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill()}
  for(const p of petals){
    p.y+=p.v;p.sw+=.02;p.x+=Math.sin(p.sw)*.8;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=.8;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.55,0,0,6.28);ctx.fill();ctx.restore();
    if(p.y>H+20)Object.assign(p,newPetal(false));
  }
  for(const h of hearts){
    h.y-=h.v;h.sw+=.02;h.x+=Math.sin(h.sw)*h.sa*.5;
    ctx.globalAlpha=h.a;ctx.fillStyle=h.c;ctx.shadowColor=h.c;ctx.shadowBlur=12;
    heartPath(h.x,h.y,h.s);ctx.fill();ctx.shadowBlur=0;
    if(h.y<-40)Object.assign(h,newHeart(false));
  }
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i];b.x+=b.vx;b.y+=b.vy;b.vy+=.12;b.life-=.012;
    if(b.life<=0){bursts.splice(i,1);continue}
    ctx.globalAlpha=b.life;ctx.fillStyle=b.c;ctx.shadowColor=b.c;ctx.shadowBlur=10;
    heartPath(b.x,b.y,b.s*b.life+4);ctx.fill();ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
frame();
</script>
